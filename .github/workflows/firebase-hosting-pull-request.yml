# Preview channel deployment for pull requests.
# TODO(before first run): replace gen-lang-client-0330226585 in both places below,
# or re-run `firebase init hosting:github` locally to regenerate with real values.
name: Deploy Firebase Hosting Preview
on: pull_request
jobs:
  build_and_preview:
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0330226585 }}"
          projectId: gen-lang-client-0330226585
