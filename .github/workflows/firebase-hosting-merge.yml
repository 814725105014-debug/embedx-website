# Deploy to Firebase Hosting (live channel) on merge to main.
# Generated to mirror `firebase init hosting:github`.
# TODO(before first run): replace embedx-club-eee in both places below,
# or simply re-run `firebase init hosting:github` locally which rewrites this file
# and creates the FIREBASE_SERVICE_ACCOUNT_... secret automatically.
name: Deploy Live to Firebase Hosting
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EMBEDX_CLUB_EEE }}
        run: |
          key_file="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$key_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$key_file"
          npx --yes firebase-tools deploy --only firestore:rules,storage --project embedx-club-eee --non-interactive
      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_EMBEDX_CLUB_EEE }}"
          channelId: live
          projectId: embedx-club-eee
