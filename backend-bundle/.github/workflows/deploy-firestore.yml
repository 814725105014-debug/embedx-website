# Deploy Firestore rules/indexes + Storage rules on merge to main.
# Requires repo secret FIREBASE_SERVICE_ACCOUNT_EMBEDX_CLUB_EEE (service-account JSON).
name: Deploy Firestore & Storage Rules
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g firebase-tools
      - name: Provide service account credentials
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_EMBEDX_CLUB_EEE }}" > /tmp/sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> "$GITHUB_ENV"
      - run: firebase deploy --only firestore:rules,firestore:indexes,storage --project embedx-club-eee --non-interactive
